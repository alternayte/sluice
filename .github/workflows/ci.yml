name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.2.13"
  JUST_VERSION: "1.58.0"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  UV_VERSION: "0.7.8"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # checks/migrations.sh compares the migrations with the latest release tag.
      - name: Check out the repository with its tags.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go.
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install just.
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Install golangci-lint.
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: Run the fast check loop.
        run: just check

      - name: Upload the test reports.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports
          path: build/reports/junit
          if-no-files-found: ignore

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository.
        uses: actions/checkout@v7

      - name: Set up Go.
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install just.
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Install uv.
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Build the UI and the server binary.
        run: just build-ui build-go

      # The Docker tests of the suite run tasks in these images.
      - name: Build the images.
        run: just build-images

      - name: Run the Go e2e suite.
        run: just e2e-go

      - name: Install the Playwright dependencies.
        run: cd tests/ui && bun install --frozen-lockfile

      - name: Check the Playwright suite types.
        run: cd tests/ui && bunx tsc --noEmit

      - name: Install the Chromium browser.
        run: cd tests/ui && bunx playwright install --with-deps chromium

      - name: Run the Playwright suite.
        run: cd tests/ui && SLUICE_E2E_BINARY=$PWD/../../bin/sluice bunx playwright test

      - name: Upload the test reports.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            build/reports/junit
            build/reports/playwright-server.log
            tests/ui/test-results
          if-no-files-found: ignore

  k8s:
    name: k8s
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository.
        uses: actions/checkout@v7

      - name: Set up Go.
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just.
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Build the images.
        run: just build-images

      # The runner image has kind, kubectl and Helm.
      - name: Run the Kubernetes suite on kind.
        run: just e2e-k8s

      - name: Upload the test reports.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k8s-reports
          path: |
            build/reports/junit
            build/reports/k8s-server.log
          if-no-files-found: ignore

  upgrade:
    name: upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # scripts/upgrade-test.sh finds the last release from the tags.
      - name: Check out the repository with its tags.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go.
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just.
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Build the server binary.
        run: just build-go

      - name: Run the last release and this binary on one database.
        run: just upgrade-test

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository.
        uses: actions/checkout@v7

      - name: Build the container image.
        run: |
          docker build -f deploy/docker/Dockerfile --target sluice \
            --build-arg VERSION="$(git describe --tags --always --dirty)" \
            --build-arg COMMIT="${{ github.sha }}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t sluice:ci .

      - name: Check the version, the commit and the build date of the image.
        run: |
          out=$(docker run --rm sluice:ci version)
          echo "$out"
          if grep -q unknown <<<"$out"; then
            echo "the image has no version, commit or build date" >&2
            exit 1
          fi
