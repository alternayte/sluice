name: Docs

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  BUN_VERSION: "1.2.13"
  JUST_VERSION: "1.58.0"

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_CF_BEACON_TOKEN: ${{ secrets.CLOUDFLARE_BEACON_TOKEN }}
    steps:
      - name: Check out the repository.
        uses: actions/checkout@v7

      - name: Set up Go.
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install just.
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      # The generated pages are current, each sample is valid, and Vale passes.
      - name: Check the docs.
        run: just docs-ref-check

      - name: Build the site.
        run: just docs

      # main deploys to sluice-docs.pages.dev; a pull request gets a preview on its own alias.
      # Nothing deploys until the repository has the CLOUDFLARE_API_TOKEN secret.
      - name: Deploy to Cloudflare Pages.
        if: env.CLOUDFLARE_API_TOKEN != ''
        id: deploy
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          url=$(bunx wrangler@4 pages deploy site/dist --project-name=sluice-docs --branch="$branch" | grep -oE 'https://[^ ]+\.pages\.dev' | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL.
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment "$PR" --body "Docs preview: $URL" --edit-last || gh pr comment "$PR" --body "Docs preview: $URL"
