name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  BUN_VERSION: "1.2.13"

jobs:
  binaries:
    name: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the repository.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go.
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build the UI.
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Build the binaries.
        run: |
          version="${GITHUB_REF_NAME}"
          pkg=github.com/alternayte/sluice/internal/app
          ldflags="-s -w -X ${pkg}.Version=${version} -X ${pkg}.Commit=${GITHUB_SHA} -X ${pkg}.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="sluice_${version#v}_${os}_${arch}"
            mkdir -p "build/${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "build/${name}/sluice" ./cmd/sluice
            cp README.md CHANGELOG.md "build/${name}/"
            tar -C build -czf "dist/${name}.tar.gz" "${name}"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Extract the release notes from the changelog.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > build/notes.md
          if [ ! -s build/notes.md ]; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi

      - name: Create the GitHub release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in v0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file build/notes.md $prerelease

  images:
    name: images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [sluice, sluice-uv]
    steps:
      - name: Check out the repository.
        uses: actions/checkout@v7

      - name: Set up QEMU.
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx.
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry.
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute the image tags.
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Read the build date.
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push the image.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
