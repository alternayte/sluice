components:
  schemas:
    Artifact:
      additionalProperties: true
      properties:
        content_type:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          type: string
        name:
          type: string
        size:
          format: int64
          type: integer
        task_key:
          type: string
        task_run_id:
          type: string
      required:
        - id
        - task_run_id
        - task_key
        - name
        - size
        - content_type
        - created_at
      type: object
    ArtifactList:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/Artifact"
          type: array
      required:
        - items
      type: object
    AuditEvent:
      additionalProperties: true
      properties:
        action:
          type: string
        actor_id:
          type: string
        actor_label:
          type: string
        actor_type:
          enum:
            - user
            - token
            - system
            - ai
          type: string
        details:
          additionalProperties: {}
          type: object
        id:
          type: string
        ip:
          type: string
        target_id:
          type: string
        target_type:
          type: string
        ts:
          format: date-time
          type: string
      required:
        - id
        - ts
        - actor_type
        - actor_id
        - actor_label
        - action
        - target_type
        - target_id
        - details
        - ip
      type: object
    AuditList:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/AuditEvent"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    BucketOut:
      additionalProperties: true
      properties:
        cancelled:
          format: int64
          type: integer
        failed:
          format: int64
          type: integer
        p50_ms:
          format: double
          type:
            - number
            - "null"
        p95_ms:
          format: double
          type:
            - number
            - "null"
        skipped:
          format: int64
          type: integer
        start:
          format: date-time
          type: string
        success:
          format: int64
          type: integer
        timed_out:
          format: int64
          type: integer
      required:
        - start
        - success
        - failed
        - timed_out
        - cancelled
        - skipped
        - p50_ms
        - p95_ms
      type: object
    ChangePasswordRequest:
      additionalProperties: true
      properties:
        current_password:
          maxLength: 1024
          type: string
        new_password:
          maxLength: 1024
          minLength: 10
          type: string
      required:
        - current_password
        - new_password
      type: object
    CheckResult:
      additionalProperties: true
      properties:
        message:
          type: string
        status:
          enum:
            - ok
            - not_found
            - access_denied
            - provider_error
          type: string
      required:
        - status
      type: object
    CheckSecretProviderRequest:
      additionalProperties: true
      properties:
        ref:
          maxLength: 512
          minLength: 1
          type: string
      required:
        - ref
      type: object
    CountResult:
      additionalProperties: true
      properties:
        count:
          format: int64
          type: integer
      required:
        - count
      type: object
    CreateGitSourceRequest:
      additionalProperties: true
      properties:
        auth_type:
          enum:
            - none
            - https_token
            - ssh_key
          type: string
        branch:
          maxLength: 255
          minLength: 1
          type: string
        credential_secret_key:
          description: Global secret key with the token or the private key.
          maxLength: 128
          type: string
        known_hosts:
          maxLength: 65536
          type: string
        mappings:
          items:
            $ref: "#/components/schemas/MappingIO"
          maxItems: 100
          minItems: 1
          type: array
        name:
          pattern: ^[a-z0-9][a-z0-9_-]{0,62}$
          type: string
        poll_interval:
          description: Seconds between polls. Default 60.
          format: int64
          maximum: 86400
          minimum: 15
          type: integer
        repo_url:
          description: https or ssh URL.
          maxLength: 2048
          minLength: 1
          type: string
        webhook_secret_key:
          description: Global secret key with the webhook secret.
          maxLength: 128
          type: string
      required:
        - name
        - repo_url
        - branch
        - auth_type
        - mappings
      type: object
    CreateNamespaceRequest:
      additionalProperties: true
      properties:
        description:
          maxLength: 2000
          type: string
        name:
          maxLength: 128
          type: string
      required:
        - name
      type: object
    CreateSecretProviderRequest:
      additionalProperties: true
      properties:
        config:
          additionalProperties: {}
          type: object
        name:
          pattern: ^[a-z0-9][a-z0-9_-]{0,62}$
          type: string
        type:
          enum:
            - kubernetes
            - azure_key_vault
            - vault
          type: string
      required:
        - name
        - type
      type: object
    CreateTokenRequest:
      additionalProperties: true
      properties:
        expires_in_days:
          format: int64
          maximum: 365
          minimum: 1
          type: integer
        name:
          maxLength: 100
          minLength: 1
          type: string
        role:
          enum:
            - viewer
            - operator
            - editor
            - admin
          type: string
      required:
        - name
        - role
      type: object
    CreateUserRequest:
      additionalProperties: true
      properties:
        email:
          format: email
          maxLength: 320
          type: string
        name:
          maxLength: 200
          type: string
        password:
          description: Temporary password. The user must change it at first login.
          maxLength: 1024
          minLength: 10
          type: string
        role:
          enum:
            - viewer
            - operator
            - editor
            - admin
          type: string
      required:
        - email
        - role
        - password
      type: object
    CreatedToken:
      additionalProperties: true
      properties:
        secret:
          type: string
        token:
          $ref: "#/components/schemas/Token"
      required:
        - token
        - secret
      type: object
    DashboardOut:
      additionalProperties: true
      properties:
        bucket_seconds:
          format: int64
          type: integer
        buckets:
          items:
            $ref: "#/components/schemas/BucketOut"
          type: array
        from:
          format: date-time
          type: string
        kpis:
          $ref: "#/components/schemas/KPIsOut"
        range:
          enum:
            - 24h
            - 7d
            - 30d
          type: string
        recent_failures:
          items:
            $ref: "#/components/schemas/ExecutionOut"
          type: array
        running:
          items:
            $ref: "#/components/schemas/ExecutionOut"
          type: array
        to:
          format: date-time
          type: string
      required:
        - range
        - from
        - to
        - bucket_seconds
        - kpis
        - buckets
        - running
        - recent_failures
      type: object
    ErrorBody:
      additionalProperties: true
      properties:
        code:
          type: string
        details: {}
        message:
          type: string
      required:
        - code
        - message
      type: object
    ErrorEnvelope:
      additionalProperties: true
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      required:
        - error
      type: object
    ExecutionDetail:
      additionalProperties: true
      properties:
        chain_depth:
          format: int64
          type: integer
        children:
          items:
            $ref: "#/components/schemas/ExecutionRef"
          type: array
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        duration_ms:
          format: int64
          type:
            - integer
            - "null"
        ended_at:
          format: date-time
          type:
            - string
            - "null"
        error:
          type: string
        flow_id:
          description: Flow ID. Null for file runs.
          type:
            - string
            - "null"
        flow_revision_id:
          type:
            - string
            - "null"
        git_sha:
          type: string
        id:
          type: string
        inputs:
          additionalProperties: {}
          type: object
        labels:
          additionalProperties:
            type: string
          type: object
        namespace:
          type: string
        outputs:
          additionalProperties: {}
          type:
            - object
            - "null"
        parent_execution_id:
          type:
            - string
            - "null"
        reason:
          type: string
        restart_of_id:
          type:
            - string
            - "null"
        secret_keys_used:
          items:
            type: string
          type: array
        snapshot_id:
          type: string
        snapshot_version:
          format: int64
          type:
            - integer
            - "null"
        started_at:
          format: date-time
          type:
            - string
            - "null"
        state:
          enum:
            - QUEUED
            - RUNNING
            - CANCELLING
            - SUCCESS
            - FAILED
            - TIMED_OUT
            - CANCELLED
            - SKIPPED
          type: string
        task_runs:
          items:
            $ref: "#/components/schemas/TaskRun"
          type: array
        trigger_payload:
          additionalProperties: {}
          type: object
        trigger_type:
          type: string
      required:
        - inputs
        - trigger_payload
        - snapshot_id
        - chain_depth
        - secret_keys_used
        - task_runs
        - children
        - id
        - namespace
        - state
        - trigger_type
        - labels
        - created_at
        - error
        - reason
        - created_by
      type: object
    ExecutionList:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/ExecutionSummary"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    ExecutionOut:
      additionalProperties: true
      properties:
        created_at:
          format: date-time
          type: string
        duration_ms:
          format: int64
          type:
            - integer
            - "null"
        ended_at:
          format: date-time
          type:
            - string
            - "null"
        error:
          type: string
        flow_id:
          type: string
        id:
          type: string
        namespace:
          type: string
        started_at:
          format: date-time
          type:
            - string
            - "null"
        state:
          type: string
        triage_summary:
          type:
            - string
            - "null"
        trigger_type:
          type: string
      required:
        - id
        - namespace
        - flow_id
        - state
        - trigger_type
        - created_at
        - error
      type: object
    ExecutionRef:
      additionalProperties: true
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        state:
          type: string
      required:
        - id
        - state
        - created_at
      type: object
    ExecutionSummary:
      additionalProperties: true
      properties:
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        duration_ms:
          format: int64
          type:
            - integer
            - "null"
        ended_at:
          format: date-time
          type:
            - string
            - "null"
        error:
          type: string
        flow_id:
          description: Flow ID. Null for file runs.
          type:
            - string
            - "null"
        id:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        namespace:
          type: string
        reason:
          type: string
        started_at:
          format: date-time
          type:
            - string
            - "null"
        state:
          enum:
            - QUEUED
            - RUNNING
            - CANCELLING
            - SUCCESS
            - FAILED
            - TIMED_OUT
            - CANCELLED
            - SKIPPED
          type: string
        trigger_type:
          type: string
      required:
        - id
        - namespace
        - state
        - trigger_type
        - labels
        - created_at
        - error
        - reason
        - created_by
      type: object
    FileChange:
      additionalProperties: true
      properties:
        content:
          description: put only. UTF-8 text content.
          type: string
        content_base64:
          description: put only. Binary content as base64. Used instead of content.
          type: string
        executable:
          type: boolean
        new_path:
          description: rename only.
          maxLength: 512
          type: string
        op:
          enum:
            - put
            - delete
            - rename
          type: string
        path:
          maxLength: 512
          type: string
      required:
        - op
        - path
      type: object
    FileDiff:
      additionalProperties: true
      properties:
        binary:
          type: boolean
        diff:
          description: Unified diff for text files.
          type: string
        path:
          type: string
        status:
          enum:
            - added
            - removed
            - modified
          type: string
      required:
        - path
        - status
        - binary
        - diff
      type: object
    FileEntry:
      additionalProperties: true
      properties:
        executable:
          type: boolean
        hash:
          type: string
        path:
          type: string
        size:
          format: int64
          type: integer
      required:
        - path
        - size
        - hash
        - executable
      type: object
    FileList:
      additionalProperties: true
      properties:
        git_sha:
          type: string
        items:
          items:
            $ref: "#/components/schemas/FileEntry"
          type: array
        snapshot_id:
          type:
            - string
            - "null"
        version:
          format: int64
          type:
            - integer
            - "null"
      required:
        - items
      type: object
    FlowDetail:
      additionalProperties: true
      properties:
        description:
          type: string
        disabled:
          type: boolean
        error_count:
          format: int64
          type: integer
        flow_id:
          type: string
        id:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        last_execution:
          $ref: "#/components/schemas/ExecutionRef"
        namespace:
          type: string
        path:
          type: string
        revision:
          $ref: "#/components/schemas/Revision"
        triggers:
          items:
            $ref: "#/components/schemas/TriggerInfo"
          type: array
        valid:
          type: boolean
      required:
        - id
        - namespace
        - flow_id
        - path
        - valid
        - disabled
        - description
        - error_count
        - triggers
      type: object
    FlowList:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/FlowSummary"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    FlowMetricsOut:
      additionalProperties: true
      properties:
        names:
          items:
            type: string
          type: array
        series:
          items:
            $ref: "#/components/schemas/MetricSeriesOut"
          type: array
      required:
        - names
        - series
      type: object
    FlowStatsOut:
      additionalProperties: true
      properties:
        recent:
          items:
            $ref: "#/components/schemas/ExecutionOut"
          type: array
      required:
        - recent
      type: object
    FlowSummary:
      additionalProperties: true
      properties:
        description:
          type: string
        disabled:
          type: boolean
        error_count:
          format: int64
          type: integer
        flow_id:
          type: string
        id:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        last_execution:
          $ref: "#/components/schemas/ExecutionRef"
        namespace:
          type: string
        path:
          type: string
        valid:
          type: boolean
      required:
        - id
        - namespace
        - flow_id
        - path
        - valid
        - disabled
        - description
        - error_count
      type: object
    Instance:
      additionalProperties: true
      properties:
        executors:
          items:
            type: string
          type: array
        heartbeat_at:
          format: date-time
          type: string
        hostname:
          type: string
        id:
          type: string
        online:
          type: boolean
        pools:
          items:
            type: string
          type: array
        started_at:
          format: date-time
          type: string
        version:
          type: string
      required:
        - id
        - hostname
        - version
        - pools
        - executors
        - started_at
        - heartbeat_at
        - online
      type: object
    InstanceList:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/Instance"
          type: array
      required:
        - items
      type: object
    Issue:
      additionalProperties: true
      properties:
        code:
          type: string
        column:
          format: int64
          type: integer
        line:
          format: int64
          type: integer
        message:
          type: string
        path:
          type: string
      required:
        - code
        - path
        - line
        - column
        - message
      type: object
    KPIsOut:
      additionalProperties: true
      properties:
        cancelled:
          format: int64
          type: integer
        executions:
          description: Executions that ended in the range.
          format: int64
          type: integer
        failed:
          format: int64
          type: integer
        median_duration_ms:
          format: double
          type:
            - number
            - "null"
        running:
          description: Executions that run now.
          format: int64
          type: integer
        skipped:
          format: int64
          type: integer
        succeeded:
          format: int64
          type: integer
        success_rate:
          description: SUCCESS / (SUCCESS + FAILED + TIMED_OUT) in the range.
          format: double
          type:
            - number
            - "null"
        timed_out:
          format: int64
          type: integer
      required:
        - executions
        - succeeded
        - failed
        - timed_out
        - cancelled
        - skipped
        - running
        - success_rate
        - median_duration_ms
      type: object
    LogEntry:
      additionalProperties: true
      properties:
        attempt:
          format: int64
          type: integer
        "n":
          description: 1-based line number in the task run.
          format: int64
          type: integer
        stream:
          enum:
            - stdout
            - stderr
            - system
          type: string
        task_key:
          type: string
        task_run_id:
          type: string
        text:
          type: string
        ts:
          format: date-time
          type: string
      required:
        - task_run_id
        - task_key
        - attempt
        - "n"
        - ts
        - stream
        - text
      type: object
    LogPage:
      additionalProperties: true
      properties:
        done:
          description: True when the execution ended and no more lines follow.
          type: boolean
        lines:
          items:
            $ref: "#/components/schemas/LogEntry"
          type: array
        next_cursor:
          type: string
      required:
        - lines
        - done
      type: object
    LoginRequest:
      additionalProperties: true
      properties:
        email:
          maxLength: 320
          minLength: 3
          type: string
        password:
          maxLength: 1024
          minLength: 1
          type: string
      required:
        - email
        - password
      type: object
    MappingIO:
      additionalProperties: true
      properties:
        namespace:
          maxLength: 128
          type: string
        repo_path:
          description: Directory in the repository. Empty is the repository root.
          maxLength: 512
          type: string
      required:
        - repo_path
        - namespace
      type: object
    Me:
      additionalProperties: true
      properties:
        auth_type:
          enum:
            - session
            - token
          type: string
        email:
          type: string
        id:
          type: string
        must_change_password:
          type: boolean
        name:
          type: string
        role:
          enum:
            - viewer
            - operator
            - editor
            - admin
          type: string
      required:
        - id
        - email
        - name
        - role
        - must_change_password
        - auth_type
      type: object
    MetricList:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/MetricPoint"
          type: array
      required:
        - items
      type: object
    MetricPoint:
      additionalProperties: true
      properties:
        name:
          type: string
        tags:
          additionalProperties:
            type: string
          type: object
        task_key:
          type: string
        task_run_id:
          type: string
        ts:
          format: date-time
          type: string
        unit:
          type: string
        value:
          format: double
          type: number
      required:
        - task_run_id
        - task_key
        - name
        - value
        - unit
        - tags
        - ts
      type: object
    MetricPointOut:
      additionalProperties: true
      properties:
        created_at:
          format: date-time
          type: string
        execution_id:
          type: string
        value:
          format: double
          type: number
      required:
        - execution_id
        - created_at
        - value
      type: object
    MetricSeriesOut:
      additionalProperties: true
      properties:
        group:
          description: Value of the group-by tag. Empty when the tag is missing or no group-by is set.
          type: string
        points:
          items:
            $ref: "#/components/schemas/MetricPointOut"
          type: array
      required:
        - group
        - points
      type: object
    Namespace:
      additionalProperties: true
      properties:
        description:
          type: string
        git_source_id:
          type:
            - string
            - "null"
        head_git_sha:
          type: string
        head_version:
          format: int64
          type:
            - integer
            - "null"
        implicit:
          description: True for a parent that exists only because of its children.
          type: boolean
        name:
          type: string
        parent:
          type: string
        read_only:
          type: boolean
        source_type:
          enum:
            - managed
            - git
            - implicit
          type: string
      required:
        - name
        - source_type
        - description
        - implicit
      type: object
    NamespaceGit:
      additionalProperties: true
      properties:
        branch:
          type: string
        last_error:
          type: string
        last_sync_at:
          format: date-time
          type:
            - string
            - "null"
        last_sync_status:
          type: string
        last_synced_sha:
          type: string
        repo_path:
          type: string
        repo_url:
          type: string
        source_id:
          type: string
        source_name:
          type: string
      required:
        - source_id
        - source_name
        - repo_url
        - branch
        - repo_path
        - last_synced_sha
        - last_sync_status
        - last_error
      type: object
    NamespaceList:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/Namespace"
          type: array
      required:
        - items
      type: object
    ProviderList:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/ProviderOut"
          type: array
      required:
        - items
      type: object
    ProviderOut:
      additionalProperties: true
      properties:
        config:
          additionalProperties: {}
          type: object
        created_at:
          format: date-time
          type: string
        name:
          type: string
        type:
          enum:
            - builtin
            - env
            - kubernetes
            - azure_key_vault
            - vault
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - name
        - type
        - config
        - created_at
        - updated_at
      type: object
    PushChange:
      additionalProperties: true
      properties:
        content:
          description: put only. UTF-8 text content.
          type: string
        content_base64:
          description: put only. Binary content as base64.
          type: string
        executable:
          type: boolean
        new_path:
          description: rename only.
          maxLength: 512
          type: string
        op:
          enum:
            - put
            - delete
            - rename
          type: string
        path:
          maxLength: 512
          type: string
      required:
        - op
        - path
