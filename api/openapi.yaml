components:
  schemas:
    Artifact:
      additionalProperties: true
      properties:
        content_type:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          type: string
        name:
          type: string
        size:
          format: int64
          type: integer
        task_key:
          type: string
        task_run_id:
          type: string
      required:
        - id
        - task_run_id
        - task_key
        - name
        - size
        - content_type
        - created_at
      type: object
    ArtifactList:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/Artifact"
          type: array
      required:
        - items
      type: object
    AuditEvent:
      additionalProperties: true
      properties:
        action:
          type: string
        actor_id:
          type: string
        actor_label:
          type: string
        actor_type:
          enum:
            - user
            - token
            - system
            - ai
          type: string
        details:
          additionalProperties: {}
          type: object
        id:
          type: string
        ip:
          type: string
        target_id:
          type: string
        target_type:
          type: string
        ts:
          format: date-time
          type: string
      required:
        - id
        - ts
        - actor_type
        - actor_id
        - actor_label
        - action
        - target_type
        - target_id
        - details
        - ip
      type: object
    AuditList:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/AuditEvent"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    ChangePasswordRequest:
      additionalProperties: true
      properties:
        current_password:
          maxLength: 1024
          type: string
        new_password:
          maxLength: 1024
          minLength: 10
          type: string
      required:
        - current_password
        - new_password
      type: object
    CountResult:
      additionalProperties: true
      properties:
        count:
          format: int64
          type: integer
      required:
        - count
      type: object
    CreateNamespaceRequest:
      additionalProperties: true
      properties:
        description:
          maxLength: 2000
          type: string
        name:
          maxLength: 128
          type: string
      required:
        - name
      type: object
    CreateTokenRequest:
      additionalProperties: true
      properties:
        expires_in_days:
          format: int64
          maximum: 365
          minimum: 1
          type: integer
        name:
          maxLength: 100
          minLength: 1
          type: string
        role:
          enum:
            - viewer
            - operator
            - editor
            - admin
          type: string
      required:
        - name
        - role
      type: object
    CreateUserRequest:
      additionalProperties: true
      properties:
        email:
          format: email
          maxLength: 320
          type: string
        name:
          maxLength: 200
          type: string
        password:
          description: Temporary password. The user must change it at first login.
          maxLength: 1024
          minLength: 10
          type: string
        role:
          enum:
            - viewer
            - operator
            - editor
            - admin
          type: string
      required:
        - email
        - role
        - password
      type: object
    CreatedToken:
      additionalProperties: true
      properties:
        secret:
          type: string
        token:
          $ref: "#/components/schemas/Token"
      required:
        - token
        - secret
      type: object
    ErrorBody:
      additionalProperties: true
      properties:
        code:
          type: string
        details: {}
        message:
          type: string
      required:
        - code
        - message
      type: object
    ErrorEnvelope:
      additionalProperties: true
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      required:
        - error
      type: object
    ExecutionDetail:
      additionalProperties: true
      properties:
        chain_depth:
          format: int64
          type: integer
        children:
          items:
            $ref: "#/components/schemas/ExecutionRef"
          type: array
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        duration_ms:
          format: int64
          type:
            - integer
            - "null"
        ended_at:
          format: date-time
          type:
            - string
            - "null"
        error:
          type: string
        flow_id:
          description: Flow ID. Null for file runs.
          type:
            - string
            - "null"
        flow_revision_id:
          type:
            - string
            - "null"
        git_sha:
          type: string
        id:
          type: string
        inputs:
          additionalProperties: {}
          type: object
        labels:
          additionalProperties:
            type: string
          type: object
        namespace:
          type: string
        outputs:
          additionalProperties: {}
          type:
            - object
            - "null"
        parent_execution_id:
          type:
            - string
            - "null"
        reason:
          type: string
        restart_of_id:
          type:
            - string
            - "null"
        secret_keys_used:
          items:
            type: string
          type: array
        snapshot_id:
          type: string
        snapshot_version:
          format: int64
          type:
            - integer
            - "null"
        started_at:
          format: date-time
          type:
            - string
            - "null"
        state:
          enum:
            - QUEUED
            - RUNNING
            - CANCELLING
            - SUCCESS
            - FAILED
            - TIMED_OUT
            - CANCELLED
            - SKIPPED
          type: string
        task_runs:
          items:
            $ref: "#/components/schemas/TaskRun"
          type: array
        trigger_payload:
          additionalProperties: {}
          type: object
        trigger_type:
          type: string
      required:
        - inputs
        - trigger_payload
        - snapshot_id
        - chain_depth
        - secret_keys_used
        - task_runs
        - children
        - id
        - namespace
        - state
        - trigger_type
        - labels
        - created_at
        - error
        - reason
        - created_by
      type: object
    ExecutionList:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/ExecutionSummary"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    ExecutionRef:
      additionalProperties: true
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        state:
          type: string
      required:
        - id
        - state
        - created_at
      type: object
    ExecutionSummary:
      additionalProperties: true
      properties:
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        duration_ms:
          format: int64
          type:
            - integer
            - "null"
        ended_at:
          format: date-time
          type:
            - string
            - "null"
        error:
          type: string
        flow_id:
          description: Flow ID. Null for file runs.
          type:
            - string
            - "null"
        id:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        namespace:
          type: string
        reason:
          type: string
        started_at:
          format: date-time
          type:
            - string
            - "null"
        state:
          enum:
            - QUEUED
            - RUNNING
            - CANCELLING
            - SUCCESS
            - FAILED
            - TIMED_OUT
            - CANCELLED
            - SKIPPED
          type: string
        trigger_type:
          type: string
      required:
        - id
        - namespace
        - state
        - trigger_type
        - labels
        - created_at
        - error
        - reason
        - created_by
      type: object
    FileChange:
      additionalProperties: true
      properties:
        content:
          description: put only. UTF-8 text content.
          type: string
        content_base64:
          description: put only. Binary content as base64. Used instead of content.
          type: string
        executable:
          type: boolean
        new_path:
          description: rename only.
          maxLength: 512
          type: string
        op:
          enum:
            - put
            - delete
            - rename
          type: string
        path:
          maxLength: 512
          type: string
      required:
        - op
        - path
      type: object
    FileDiff:
      additionalProperties: true
      properties:
        binary:
          type: boolean
        diff:
          description: Unified diff for text files.
          type: string
        path:
          type: string
        status:
          enum:
            - added
            - removed
            - modified
          type: string
      required:
        - path
        - status
        - binary
        - diff
      type: object
    FileEntry:
      additionalProperties: true
      properties:
        executable:
          type: boolean
        hash:
          type: string
        path:
          type: string
        size:
          format: int64
          type: integer
      required:
        - path
        - size
        - hash
        - executable
      type: object
    FileList:
      additionalProperties: true
      properties:
        git_sha:
          type: string
        items:
          items:
            $ref: "#/components/schemas/FileEntry"
          type: array
        snapshot_id:
          type:
            - string
            - "null"
        version:
          format: int64
          type:
            - integer
            - "null"
      required:
        - items
      type: object
    FlowDetail:
      additionalProperties: true
      properties:
        description:
          type: string
        disabled:
          type: boolean
        error_count:
          format: int64
          type: integer
        flow_id:
          type: string
        id:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        last_execution:
          $ref: "#/components/schemas/ExecutionRef"
        namespace:
          type: string
        path:
          type: string
        revision:
          $ref: "#/components/schemas/Revision"
        triggers:
          items:
            $ref: "#/components/schemas/TriggerInfo"
          type: array
        valid:
          type: boolean
      required:
        - id
        - namespace
        - flow_id
        - path
        - valid
        - disabled
        - description
        - error_count
        - triggers
      type: object
    FlowList:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/FlowSummary"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    FlowSummary:
      additionalProperties: true
      properties:
        description:
          type: string
        disabled:
          type: boolean
        error_count:
          format: int64
          type: integer
        flow_id:
          type: string
        id:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        last_execution:
          $ref: "#/components/schemas/ExecutionRef"
        namespace:
          type: string
        path:
          type: string
        valid:
          type: boolean
      required:
        - id
        - namespace
        - flow_id
        - path
        - valid
        - disabled
        - description
        - error_count
      type: object
    Instance:
      additionalProperties: true
      properties:
        executors:
          items:
            type: string
          type: array
        heartbeat_at:
          format: date-time
          type: string
        hostname:
          type: string
        id:
          type: string
        online:
          type: boolean
        pools:
          items:
            type: string
          type: array
        started_at:
          format: date-time
          type: string
        version:
          type: string
      required:
        - id
        - hostname
        - version
        - pools
        - executors
        - started_at
        - heartbeat_at
        - online
      type: object
    InstanceList:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/Instance"
          type: array
      required:
        - items
      type: object
    Issue:
      additionalProperties: true
      properties:
        code:
          type: string
        column:
          format: int64
          type: integer
        line:
          format: int64
          type: integer
        message:
          type: string
        path:
          type: string
      required:
        - code
        - path
        - line
        - column
        - message
      type: object
    LogEntry:
      additionalProperties: true
      properties:
        attempt:
          format: int64
          type: integer
        "n":
          description: 1-based line number in the task run.
          format: int64
          type: integer
        stream:
          enum:
            - stdout
            - stderr
            - system
          type: string
        task_key:
          type: string
        task_run_id:
          type: string
        text:
          type: string
        ts:
          format: date-time
          type: string
      required:
        - task_run_id
        - task_key
        - attempt
        - "n"
        - ts
        - stream
        - text
      type: object
    LogPage:
      additionalProperties: true
      properties:
        done:
          description: True when the execution ended and no more lines follow.
          type: boolean
        lines:
          items:
            $ref: "#/components/schemas/LogEntry"
          type: array
        next_cursor:
          type: string
      required:
        - lines
        - done
      type: object
    LoginRequest:
      additionalProperties: true
      properties:
        email:
          maxLength: 320
          minLength: 3
          type: string
        password:
          maxLength: 1024
          minLength: 1
          type: string
      required:
        - email
        - password
      type: object
    Me:
      additionalProperties: true
      properties:
        auth_type:
          enum:
            - session
            - token
          type: string
        email:
          type: string
        id:
          type: string
        must_change_password:
          type: boolean
        name:
          type: string
        role:
          enum:
            - viewer
            - operator
            - editor
            - admin
          type: string
      required:
        - id
        - email
        - name
        - role
        - must_change_password
        - auth_type
      type: object
    MetricList:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/MetricPoint"
          type: array
      required:
        - items
      type: object
    MetricPoint:
      additionalProperties: true
      properties:
        name:
          type: string
        tags:
          additionalProperties:
            type: string
          type: object
        task_key:
          type: string
        task_run_id:
          type: string
        ts:
          format: date-time
          type: string
        unit:
          type: string
        value:
          format: double
          type: number
      required:
        - task_run_id
        - task_key
        - name
        - value
        - unit
        - tags
        - ts
      type: object
    Namespace:
      additionalProperties: true
      properties:
        description:
          type: string
        git_source_id:
          type:
            - string
            - "null"
        head_git_sha:
          type: string
        head_version:
          format: int64
          type:
            - integer
            - "null"
        implicit:
          description: True for a parent that exists only because of its children.
          type: boolean
        name:
          type: string
        parent:
          type: string
        read_only:
          type: boolean
        source_type:
          enum:
            - managed
            - git
            - implicit
          type: string
      required:
        - name
        - source_type
        - description
        - implicit
      type: object
    NamespaceList:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/Namespace"
          type: array
      required:
        - items
      type: object
    ResetPasswordRequest:
      additionalProperties: true
      properties:
        password:
          maxLength: 1024
          minLength: 10
          type: string
      required:
        - password
      type: object
    RevertRequest:
      additionalProperties: true
      properties:
        message:
          maxLength: 500
          type: string
        version:
          format: int64
          minimum: 1
          type: integer
      required:
        - version
      type: object
    Revision:
      additionalProperties: true
      properties:
        created_at:
          format: date-time
          type: string
        definition:
          additionalProperties: {}
          type:
            - object
            - "null"
        errors:
          items:
            $ref: "#/components/schemas/Issue"
          type: array
        git_sha:
          type: string
        id:
          type: string
        message:
          type: string
        path:
          type: string
        snapshot_version:
          format: int64
          type:
            - integer
            - "null"
        source:
          type: string
        valid:
          type: boolean
      required:
        - id
        - created_at
        - path
        - source
        - valid
        - errors
      type: object
    RevisionList:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/RevisionSummary"
          type: array
      required:
        - items
      type: object
    RevisionSummary:
      additionalProperties: true
      properties:
        created_at:
          format: date-time
          type: string
        error_count:
          format: int64
          type: integer
        git_sha:
          type: string
        id:
          type: string
        message:
          type: string
        snapshot_version:
          format: int64
          type:
            - integer
            - "null"
        valid:
          type: boolean
      required:
        - id
        - created_at
        - valid
        - error_count
      type: object
    RunFileRequest:
      additionalProperties: true
      properties:
        args:
          items:
            type: string
          maxItems: 100
          type: array
        path:
          maxLength: 512
          type: string
      required:
        - path
      type: object
    RunnerComplete:
      additionalProperties: true
      properties:
        error:
          type: string
        exit_code:
          format: int64
          type: integer
        reason:
          type: string
      required:
        - exit_code
        - error
      type: object
    RunnerEvent:
      additionalProperties: true
      properties:
        key:
          type: string
        name:
          type: string
        tags:
          additionalProperties:
            type: string
          type: object
        ts:
          format: date-time
          type: string
        type:
          enum:
            - output
            - metric
          type: string
        unit:
          type: string
        value: {}
      required:
        - type
      type: object
    RunnerEventBatch:
      additionalProperties: true
      properties:
        events:
          items:
            $ref: "#/components/schemas/RunnerEvent"
          maxItems: 1000
          type: array
        seq:
          format: int64
          minimum: 1
          type: integer
      required:
        - seq
        - events
      type: object
    RunnerHeartbeatResponse:
      additionalProperties: true
      properties:
        cancel:
          type: boolean
      required:
        - cancel
      type: object
    RunnerLimits:
      additionalProperties: true
      properties:
        max_artifact_bytes:
          format: int64
          type: integer
        max_bundle_bytes:
          format: int64
          type: integer
      required:
        - max_artifact_bytes
        - max_bundle_bytes
      type: object
    RunnerLogBatch:
      additionalProperties: true
      properties:
        lines:
          items:
            $ref: "#/components/schemas/RunnerLogLine"
          type: array
        seq:
          format: int64
          minimum: 1
          type: integer
      required:
        - seq
        - lines
      type: object
    RunnerLogLine:
      additionalProperties: true
      properties:
        stream:
          enum:
            - stdout
            - stderr
            - system
          type: string
        text:
          type: string
        ts:
          format: date-time
          type: string
      required:
        - ts
        - stream
        - text
      type: object
    RunnerSpec:
      additionalProperties: true
      properties:
        attempt:
          format: int64
          type: integer
        bundle_hash:
          type: string
        command:
          items:
            type: string
          type: array
        env:
          additionalProperties:
            type: string
          type: object
        execution_id:
          type: string
        flow_id:
          type: string
        limits:
          $ref: "#/components/schemas/RunnerLimits"
        mask_values:
          items:
            type: string
          type: array
        namespace:
          type: string
        runtime:
          type: string
        task_id:
          type: string
        task_run_id:
          type: string
        timeout_seconds:
          format: int64
          type: integer
        workdir:
          type: string
      required:
        - task_run_id
        - execution_id
        - namespace
        - flow_id
        - task_id
        - attempt
        - command
        - workdir
        - env
        - timeout_seconds
        - mask_values
        - bundle_hash
        - limits
      type: object
    SaveChangesRequest:
      additionalProperties: true
      properties:
        base_version:
          description: Fails with 409 version_conflict when the head version differs.
          format: int64
          type: integer
        changes:
          items:
            $ref: "#/components/schemas/FileChange"
          maxItems: 1000
          minItems: 1
          type: array
        message:
          maxLength: 500
          minLength: 1
          type: string
      required:
        - message
        - changes
      type: object
    Snapshot:
      additionalProperties: true
      properties:
        author:
          type: string
        created_at:
          format: date-time
          type: string
        file_count:
          format: int64
          type: integer
        git_sha:
          type: string
        id:
          type: string
        manifest_hash:
          type: string
        message:
          type: string
        version:
          format: int64
          type:
            - integer
            - "null"
      required:
        - id
        - message
        - author
        - created_at
        - manifest_hash
        - file_count
      type: object
    SnapshotList:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/Snapshot"
          type: array
      required:
        - items
      type: object
    TaskRun:
      additionalProperties: true
      properties:
        attempt:
          format: int64
          type: integer
        child_execution_id:
          type:
            - string
            - "null"
        duration_ms:
          format: int64
          type:
            - integer
            - "null"
        ended_at:
          format: date-time
          type:
            - string
            - "null"
        error:
          type: string
        executor_type:
          type: string
        exit_code:
          format: int64
          type:
            - integer
            - "null"
        id:
          type: string
        outputs:
          additionalProperties: {}
          type:
            - object
            - "null"
        pool:
          type: string
        queued_at:
          format: date-time
          type:
            - string
            - "null"
        reason:
          type: string
        reused_from_id:
          type:
            - string
            - "null"
        started_at:
          format: date-time
          type:
            - string
            - "null"
        state:
          enum:
            - PENDING
            - QUEUED
            - RUNNING
            - SUCCESS
            - FAILED
            - TIMED_OUT
            - CANCELLED
            - SKIPPED
          type: string
        task_key:
          type: string
        task_type:
          type: string
      required:
        - id
        - task_key
        - task_type
        - attempt
        - state
        - reason
        - executor_type
        - pool
        - error
      type: object
    TextDiff:
      additionalProperties: true
      properties:
        diff:
          type: string
      required:
        - diff
      type: object
    Token:
      additionalProperties: true
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        last_used_at:
          format: date-time
          type: string
        name:
          type: string
        prefix:
          type: string
        revoked_at:
          format: date-time
          type: string
        role:
          enum:
            - viewer
            - operator
            - editor
            - admin
          type: string
        user_email:
          type: string
        user_id:
          type: string
      required:
        - id
        - user_id
        - user_email
        - name
        - prefix
        - role
        - created_at
      type: object
    TokenList:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/Token"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    TriggerInfo:
      additionalProperties: true
      properties:
        active:
          type: boolean
        config:
          additionalProperties: {}
          type: object
        has_webhook_key:
          type: boolean
        key:
          type: string
        last_fired_at:
          format: date-time
          type:
            - string
            - "null"
        next_fire_at:
          format: date-time
          type:
            - string
            - "null"
        type:
          enum:
            - schedule
            - webhook
            - flow
          type: string
      required:
        - key
        - type
        - active
        - config
        - has_webhook_key
      type: object
    TriggerRequest:
      additionalProperties: true
      properties:
        inputs:
          additionalProperties: {}
          type: object
        labels:
          additionalProperties:
            maxLength: 256
            type: string
          maxProperties: 20
          type: object
      type: object
    UpdateFlowRequest:
      additionalProperties: true
      properties:
        disabled:
          type: boolean
      required:
        - disabled
      type: object
    UpdateMeRequest:
      additionalProperties: true
      properties:
        name:
          maxLength: 200
          type: string
      required:
        - name
      type: object
    UpdateUserRequest:
      additionalProperties: true
      properties:
        disabled:
          type: boolean
        name:
          maxLength: 200
          type: string
        role:
          enum:
            - viewer
            - operator
            - editor
            - admin
          type: string
      type: object
    User:
      additionalProperties: true
      properties:
        created_at:
          format: date-time
          type: string
        disabled:
          type: boolean
        email:
          type: string
        id:
          type: string
        last_login_at:
          format: date-time
          type: string
        must_change_password:
          type: boolean
        name:
          type: string
        role:
          enum:
            - viewer
            - operator
            - editor
            - admin
          type: string
      required:
        - id
        - email
        - name
        - role
        - must_change_password
        - disabled
        - created_at
      type: object
    UserList:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/User"
          type: array
        next_cursor:
          type: string
      required:
        - items
      type: object
    ValidateFileRequest:
      additionalProperties: true
      properties:
        content:
          type: string
        path:
          maxLength: 512
          type: string
      required:
        - path
        - content
      type: object
    ValidateFileResult:
      additionalProperties: true
      properties:
        errors:
          items:
            $ref: "#/components/schemas/Issue"
          type: array
        flow_id:
          type: string
        kind:
          enum:
            - flow
            - namespace
            - other
          type: string
        valid:
          type: boolean
      required:
        - valid
        - kind
        - errors
      type: object
    VersionDiff:
      additionalProperties: true
      properties:
        files:
          items:
            $ref: "#/components/schemas/FileDiff"
          type: array
        from:
          format: int64
          type: integer
        to:
          format: int64
          type: integer
      required:
        - from
        - to
        - files
      type: object
info:
  title: Sluice API
