info:
  title: Sluice API
  version: "1"
openapi: 3.1.0
paths:
  /api/runner/v1/task-runs/{taskRunId}/artifacts/{name}:
    put:
      operationId: runnerPutArtifact
      parameters:
        - in: path
          name: taskRunId
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: name
          required: true
          schema:
            maxLength: 200
            type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "204":
          description: Stored.
  /api/runner/v1/task-runs/{taskRunId}/bundle:
    get:
      operationId: runnerGetBundle
      parameters:
        - in: path
          name: taskRunId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/gzip: {}
          description: Bundle.
  /api/runner/v1/task-runs/{taskRunId}/complete:
    post:
      operationId: runnerComplete
      parameters:
        - in: path
          name: taskRunId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerComplete"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
  /api/runner/v1/task-runs/{taskRunId}/events:
    post:
      operationId: runnerPostEvents
      parameters:
        - in: path
          name: taskRunId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerEventBatch"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
  /api/runner/v1/task-runs/{taskRunId}/heartbeat:
    post:
      operationId: runnerHeartbeat
      parameters:
        - in: path
          name: taskRunId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerHeartbeatResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
  /api/runner/v1/task-runs/{taskRunId}/logs:
    post:
      operationId: runnerPostLogs
      parameters:
        - in: path
          name: taskRunId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerLogBatch"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
  /api/runner/v1/task-runs/{taskRunId}/spec:
    get:
      operationId: runnerGetSpec
      parameters:
        - in: path
          name: taskRunId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerSpec"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
  /api/v1/audit:
    get:
      operationId: listAuditEvents
      parameters:
        - explode: false
          in: query
          name: actor
          schema:
            type: string
        - explode: false
          in: query
          name: action
          schema:
            type: string
        - explode: false
          in: query
          name: target
          schema:
            type: string
        - explode: false
          in: query
          name: from
          schema:
            format: date-time
            type: string
        - explode: false
          in: query
          name: to
          schema:
            format: date-time
            type: string
        - explode: false
          in: query
          name: cursor
          schema:
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
          description: OK
