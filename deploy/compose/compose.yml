# Sluice and Postgres on one host. It needs no checkout:
#   curl -fsSLO https://raw.githubusercontent.com/alternayte/sluice/main/deploy/compose/compose.yml
#   export SLUICE_BOOTSTRAP_ADMIN_PASSWORD=change-me-now-1
#   export SLUICE_MASTER_KEYS="k1:$(openssl rand -base64 32)"
#   docker compose up -d
name: sluice
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sluice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sluice}
      POSTGRES_DB: sluice
    # The data stays when the container is recreated. "down -v" removes it.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sluice -d sluice"]
      interval: 2s
      timeout: 2s
      retries: 30
  sluice:
    # The released image. sluice-uv runs Python, bash and bun tasks on the process executor.
    # Pin a release in production, for example SLUICE_IMAGE=ghcr.io/alternayte/sluice-uv:0.2.2.
    # For a build from source, run `just build-images` and set SLUICE_IMAGE=sluice-uv:dev.
    image: ${SLUICE_IMAGE:-ghcr.io/alternayte/sluice-uv:latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SLUICE_DATABASE_URL: postgres://sluice:${POSTGRES_PASSWORD:-sluice}@postgres:5432/sluice?sslmode=disable
      SLUICE_PUBLIC_URL: ${SLUICE_PUBLIC_URL:-http://localhost:8080}
      SLUICE_BOOTSTRAP_ADMIN_EMAIL: ${SLUICE_BOOTSTRAP_ADMIN_EMAIL:-admin@local.test}
      SLUICE_BOOTSTRAP_ADMIN_PASSWORD: ${SLUICE_BOOTSTRAP_ADMIN_PASSWORD:?set SLUICE_BOOTSTRAP_ADMIN_PASSWORD}
      SLUICE_MASTER_KEYS: ${SLUICE_MASTER_KEYS:?set SLUICE_MASTER_KEYS}
      SLUICE_EXECUTORS: process
    ports:
      - "${SLUICE_PORT:-8080}:8080"
volumes:
  postgres-data:
