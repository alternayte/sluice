name: sluice-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sluice
      POSTGRES_PASSWORD: sluice
      POSTGRES_DB: sluice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sluice -d sluice"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  pgdata: {}
