apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sluice.fullname" . }}
  labels:
    {{- include "sluice.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "sluice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sluice.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "sluice.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ add .Values.shutdownGraceSeconds 10 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sluice
          image: {{ include "sluice.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SLUICE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.key }}
            {{- if .Values.masterKeys.existingSecret }}
            - name: SLUICE_MASTER_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.masterKeys.existingSecret }}
                  key: {{ .Values.masterKeys.key }}
            {{- end }}
            {{- if .Values.bootstrapAdmin.existingSecret }}
            - name: SLUICE_BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrapAdmin.existingSecret }}
                  key: {{ .Values.bootstrapAdmin.emailKey }}
            - name: SLUICE_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrapAdmin.existingSecret }}
                  key: {{ .Values.bootstrapAdmin.passwordKey }}
            {{- end }}
            - name: SLUICE_LISTEN_ADDR
              value: ":8080"
            - name: SLUICE_PUBLIC_URL
              value: {{ .Values.publicURL | quote }}
            - name: SLUICE_INTERNAL_URL
              value: {{ include "sluice.internalURL" . | quote }}
            - name: SLUICE_POOLS
              value: {{ join "," .Values.pools | quote }}
            - name: SLUICE_EXECUTORS
              value: {{ .Values.executors | quote }}
            - name: SLUICE_RUNNER_IMAGE
              value: {{ default (include "sluice.image" .) .Values.runnerImage | quote }}
            - name: SLUICE_STORAGE_TYPE
              value: {{ .Values.storage.type | quote }}
            - name: SLUICE_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SLUICE_K8S_MAX_JOBS
              value: {{ .Values.kubernetes.maxJobs | quote }}
            - name: SLUICE_K8S_JOB_TTL
              value: {{ .Values.kubernetes.jobTTL | quote }}
            - name: SLUICE_K8S_PENDING_TIMEOUT
              value: {{ .Values.kubernetes.pendingTimeout | quote }}
            - name: SLUICE_SHUTDOWN_GRACE
              value: {{ printf "%vs" .Values.shutdownGraceSeconds | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The only writable path. No PVC: all state is in Postgres (C-03).
            - name: tmp
              mountPath: /tmp
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
