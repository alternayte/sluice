# Sluice with a demo warehouse for the ELT example. Start it from the repository root:
#   docker compose -f examples/elt/compose.yml up -d
# It needs SLUICE_BOOTSTRAP_ADMIN_PASSWORD and SLUICE_MASTER_KEYS, as deploy/compose does.
include:
  - ../../deploy/compose/compose.yml

services:
  warehouse:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: elt
      POSTGRES_PASSWORD: ${ELT_PG_PASSWORD:-elt-password-1}
      POSTGRES_DB: warehouse
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elt -d warehouse"]
      interval: 2s
      timeout: 2s
      retries: 30
