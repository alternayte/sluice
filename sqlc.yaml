        sql_package: pgx/v5
        emit_json_tags: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema: db/migrations
    queries: internal/execution/queries.sql
    gen:
      go:
        package: executiondb
