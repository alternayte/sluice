version: "2"
overrides:
  go:
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: true
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          import: time
          type: Time
          pointer: true
      - db_type: jsonb
        go_type: encoding/json.RawMessage
      - db_type: jsonb
        nullable: true
        go_type: encoding/json.RawMessage
      - db_type: citext
        go_type: string
sql:
  - engine: postgresql
    schema: db/migrations
    queries: internal/auth/queries.sql
    gen:
      go:
        package: authdb
        out: internal/auth/authdb
        sql_package: pgx/v5
        emit_json_tags: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema: db/migrations
    queries: internal/audit/queries.sql
    gen:
      go:
        package: auditdb
        out: internal/audit/auditdb
