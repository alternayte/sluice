# Vault dev server for the [K] scenarios (SDD §10.4). The vault service account may review
# tokens, which Kubernetes auth needs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sluice-e2e-vault-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: sluice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
spec:
  replicas: 1
  selector:
    matchLabels: { app: vault }
  template:
    metadata:
      labels: { app: vault }
    spec:
      serviceAccountName: vault
      containers:
        - name: vault
          image: hashicorp/vault:2.1.0
          args: ["server", "-dev"]
          env:
            - { name: VAULT_DEV_ROOT_TOKEN_ID, value: root }
            - { name: VAULT_DEV_LISTEN_ADDRESS, value: "0.0.0.0:8200" }
            - { name: SKIP_SETCAP, value: "true" }
          ports:
            - containerPort: 8200
          readinessProbe:
            httpGet: { path: /v1/sys/health, port: 8200 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: vault
spec:
  selector: { app: vault }
  ports:
    - port: 8200
